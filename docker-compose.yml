version: "3.9"

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./dataset:/app/dataset
      - ./vlm/vlm_checkpoints:/app/vlm/vlm_checkpoints
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  # Serve frontend pages
  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    restart: unless-stopped
