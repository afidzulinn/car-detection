<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 220px; padding: 16px;
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a; color: #e2e8f0;
    }
    h3 { margin-bottom: 12px; font-size: 1rem; color: #38bdf8; }
    button {
      width: 100%; padding: 10px; margin: 4px 0;
      border-radius: 8px; border: none; cursor: pointer;
      font-size: 0.9rem; font-weight: 600; transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    #start { background: #22c55e; color: white; }
    #stop  { background: #ef4444; color: white; }
    .hint { margin-top: 12px; font-size: 0.75rem; color: #64748b; line-height: 1.5; }
  </style>
</head>
<body>
  <h3>🚗 Car Detector</h3>
  <button id="start">▶ Start Detection</button>
  <button id="stop">⏹ Stop Detection</button>
  <div class="hint">Backend must be running on<br><strong style="color:#94a3b8">localhost:8000</strong></div>
  <script>
    document.getElementById("start").onclick = () => chrome.runtime.sendMessage({ action: "START" });
    document.getElementById("stop").onclick  = () => chrome.runtime.sendMessage({ action: "STOP" });
  </script>
</body>
</html>
