<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 250px; padding: 16px;
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a; color: #e2e8f0;
    }
    h3 { margin-bottom: 12px; font-size: 1rem; color: #38bdf8; }
    button {
      width: 100%; padding: 10px; margin: 4px 0;
      border-radius: 8px; border: none; cursor: pointer;
      font-size: 0.9rem; font-weight: 600; transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    #start { background: #22c55e; color: white; }
    #stop  { background: #ef4444; color: white; }
    #status { margin-top: 8px; font-size: 0.78rem; color: #94a3b8; font-weight: 600; }
    .hint { margin-top: 10px; font-size: 0.75rem; color: #64748b; line-height: 1.5; }
  </style>
</head>
<body>
  <h3>🚗 Car Detector Streamer</h3>
  <button id="start">▶ Start Streaming</button>
  <button id="stop">⏹ Stop Streaming</button>
  <div id="status">Status: Idle</div>
  <div class="hint">
    <strong>Petunjuk:</strong><br>
    Buka tab yang menampilkan <strong>Model Mobil 3D</strong>, lalu klik <strong>Start Streaming</strong> pada tab tersebut.<br><br>
    Ekstensi secara otomatis mengabaikan tab <em>localhost:8000</em> agar tidak terjadi rekursi (mirroring loop).
  </div>
  <script src="popup.js"></script>
</body>
</html>
